name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  JWT_SECRET: secreto-de-ci-no-es-real
  JWT_EXPIRES_IN: 60m
  THROTTLE_TTL: 60
  THROTTLE_LIMIT: 10

jobs:
  spec:
    name: Especificación (OpenSpec + OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # El lockfile lo escribe npm 11; el runner trae npm 10.8.2, que exige en el lock
      # subarboles de dependencias opcionales que npm 11 considera innecesarios (los
      # @emnapi/* de las variantes wasm32 de sharp y de @tailwindcss/oxide). Fijar la
      # version alinea quien escribe el lock con quien lo consume.
      - name: Fijar npm a la version que escribe el lockfile
        run: npm install -g npm@11.6.1

      - run: npm ci

      # D4: la CLI de OpenSpec es devDependency de la raíz (versión fijada en
      # package-lock.json), se resuelve desde node_modules, no vía npx.
      - name: openspec validate --all --strict
        run: ./node_modules/.bin/openspec validate --all --strict

      - name: Lint del contrato OpenAPI (Spectral)
        run: npm run openapi:lint

      # D1/D2: el chequeo de deriva compara paths + components.schemas contra el spec
      # que @nestjs/swagger genera desde la app compilada del backend.
      - name: Compilar backend (para generar el spec con @nestjs/swagger)
        run: npm run build -w backend

      - name: Chequeo de deriva del contrato OpenAPI
        run: npm run openapi:check

  lint:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # El lockfile lo escribe npm 11; el runner trae npm 10.8.2, que exige en el lock
      # subarboles de dependencias opcionales que npm 11 considera innecesarios (los
      # @emnapi/* de las variantes wasm32 de sharp y de @tailwindcss/oxide). Fijar la
      # version alinea quien escribe el lock con quien lo consume.
      - name: Fijar npm a la version que escribe el lockfile
        run: npm install -g npm@11.6.1

      - run: npm ci

      - name: ESLint (backend + frontend)
        run: npm run lint

      - name: Chequeo de tipos (tsc --noEmit)
        run: npm run typecheck

  test:
    name: Tests (backend)
    runs-on: ubuntu-latest
    # ci-integracion-db (roadmap §6.1): un solo service container de Postgres para todo
    # el job. Alcanza con una base (reservas_test) porque en CI no existe un "desarrollo"
    # separado del testing — a diferencia de docker-compose.yml local (D5 de
    # fundacion-repo), que sí separa reservas_dev de reservas_test.
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reservas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Ningún valor de acá es secreto (config.yaml §10): son las mismas credenciales de
    # juguete que ya documentan .env.example y docker-compose.yml para desarrollo local.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reservas_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/reservas_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # El lockfile lo escribe npm 11; el runner trae npm 10.8.2, que exige en el lock
      # subarboles de dependencias opcionales que npm 11 considera innecesarios (los
      # @emnapi/* de las variantes wasm32 de sharp y de @tailwindcss/oxide). Fijar la
      # version alinea quien escribe el lock con quien lo consume.
      - name: Fijar npm a la version que escribe el lockfile
        run: npm install -g npm@11.6.1

      - run: npm ci

      # migrate deploy (no migrate dev): aplica las migraciones commiteadas sin pedir
      # input, apto para CI. migrate dev es interactivo y falla con "the environment is
      # non-interactive" en un runner sin TTY (comprobado a mano durante modelo-dominio).
      - name: Migrar la base de datos de test
        run: npx prisma migrate deploy --schema backend/prisma/schema.prisma

      - name: Seed de la base de datos de test
        run: npm run db:seed -w backend

      - name: Tests unitarios del backend
        run: npm run test -w backend

      # El jest del backend usa rootDir "src" y testRegex ".*\.spec\.ts$", asi que los
      # archivos de backend/test/*.e2e-spec.ts NO los corre `npm run test`. Sin este paso
      # existirian tests que nadie ejecuta.
      - name: Tests e2e del backend
        run: npm run test:e2e

      # ci-integracion-db: la contrapartida de haber dejado sin PostgreSQL el job test
      # desde fundacion-repo (D8). Corre backend/test/*.integration-spec.ts contra la
      # base real de arriba — los invariantes de negocio de modelo-dominio, el guard del
      # índice parcial de Reserva, y cualquier suite de integración que sumen los changes
      # siguientes.
      - name: Tests de integracion del backend (contra Postgres real)
        run: npm run test:integration -w backend

      # La comparacion de contratos de scripts/openapi-diff.mjs es logica pura y sutil
      # (que diferencias de orden son deriva y cuales no). Se testea aparte, sin build.
      - name: Tests de las utilidades de scripts/
        run: npm run test:scripts
